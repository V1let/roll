<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Комплимат 🌸</title>
</head>
<body>
    <body>

    <div class="machine">
      <h1 class="title">Сегодня ты:</h1>
      <p class="subtitle" id="subtitle">✨ Нажми и узнай свой комплимент ✨</p>

      <div class="slots">
        <div class="slot"><div class="reel" id="reel0"></div></div>
        <div class="slot"><div class="reel" id="reel1"></div></div>
        <div class="slot"><div class="reel" id="reel2"></div></div>
      </div>

      <button class="spin-btn" id="spinBtn">Прокрутить</button>

      <div class="timer-box" id="timerBox">
        <div class="timer-label">⏳ Следующая прокрутка через:</div>
        <div class="timer-value" id="timerValue">00:00:00</div>
      </div>
    </div>
</body>
<script src="script.js" defer></script>
</html>
